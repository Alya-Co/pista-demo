<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pista Matemáticas 3º</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap">
<style>
/* Layout: soft lavender app shell; white rounded cards; top tabs on laptop, bottom nav on phone. Purple primary, pastel tiles, 3D-ish heroes. */
:root{
  --bg:#F1EEFF; --surface:#FFFFFF; --surface2:#F6F3FF; --line:#E4DEFA; --text:#22204A; --muted:#6B6890;
  --primary:#6C3BF5; --primary-2:#8A63FF; --primary-soft:#ECE5FF; --primary-text:#5A2AE6;
  --orange:#FF7A2F; --orange-soft:#FFEBDD; --green:#22B565; --green-soft:#E2F7EA; --yellow:#FFB81F; --yellow-soft:#FFF4D6;
  --red:#F04B55; --red-soft:#FFE6E8; --grey:#B9B6CF; --blue:#2E8CFF; --blue-soft:#E3F0FF;
  --shadow:0 6px 22px rgba(76,52,170,.10),0 1px 3px rgba(76,52,170,.08);
  --font:"Nunito","Segoe UI",system-ui,sans-serif;
  --r:22px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17152E; --surface:#24214A; --surface2:#2C2957; --line:#3A3670; --text:#F1EFFF; --muted:#B3AFD8;
  --primary:#8A63FF; --primary-2:#A285FF; --primary-soft:#3A2F78; --primary-text:#C9B6FF;
  --orange-soft:#4A2D1C; --green-soft:#173D2A; --yellow-soft:#46391A; --red-soft:#4D1F27; --blue-soft:#1C3354; --grey:#5D5A85;
  --shadow:0 6px 22px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17152E; --surface:#24214A; --surface2:#2C2957; --line:#3A3670; --text:#F1EFFF; --muted:#B3AFD8;
  --primary:#8A63FF; --primary-2:#A285FF; --primary-soft:#3A2F78; --primary-text:#C9B6FF;
  --orange-soft:#4A2D1C; --green-soft:#173D2A; --yellow-soft:#46391A; --red-soft:#4D1F27; --blue-soft:#1C3354; --grey:#5D5A85;
  --shadow:0 6px 22px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--text);font-family:var(--font);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{margin:0;line-height:1.15;font-weight:900;text-wrap:balance}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible{outline:3px solid var(--primary-2);outline-offset:2px}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tr{display:block;font-size:.84em;color:var(--muted);font-weight:600;margin-top:1px}
.tr:empty{display:none}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);box-shadow:0 1px 0 var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;padding-block:10px}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:1.55rem;text-decoration:none;color:var(--text)}
.logo span{width:40px;height:40px;display:block}
.tabs{display:flex;gap:6px;flex:1;min-width:0}
.tab{border:none;background:none;border-radius:14px;padding:8px 14px;font-weight:800;color:var(--muted)}
.tab:hover{background:var(--surface2)}
.tab[aria-current="page"]{background:var(--primary);color:#fff}
.tools{display:flex;gap:8px;align-items:center;margin-left:auto}
.sel{border:1.5px solid var(--line);border-radius:12px;background:var(--surface);padding:6px 8px;font-weight:800}
.iconbtn{width:38px;height:38px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px}
.bnav{display:none}
@media (max-width:760px){
  .tabs{display:none}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);box-shadow:0 -1px 0 var(--line);
    padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .bnav button{flex:1;border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.78rem;font-weight:800;color:var(--muted);padding:4px}
  .bnav button svg{width:24px;height:24px}
  .bnav button[aria-current="page"]{color:var(--primary-text)}
  main{padding-bottom:110px!important}
}
main{padding-block:20px 50px}
.screen{display:grid;gap:18px;min-width:0}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;min-width:0;border:1px solid var(--line)}
.eyebrow{font-size:.85rem;font-weight:700;color:var(--muted)}
.hero{width:92px;height:92px;flex:0 0 auto}
@media (max-width:600px){.hero{width:70px;height:70px}.kid>div:nth-child(2),.dhead>div:nth-child(2){flex:1 1 calc(100% - 90px)}}
.bob{animation:bob 3.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes pop{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pimg{width:100%;height:100%;object-fit:contain;display:block}
.rbwrap{position:relative;width:100%;height:100%}
.rbwrap .pimg{position:absolute;inset:0}
.rbsvg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:100%;height:100%;overflow:visible}
.rb-body{transform-origin:center;animation:rbturn 7s ease-in-out infinite}
.rb-needle{transform-box:view-box;transform-origin:207px 226.5px;animation:rbneedle 7s cubic-bezier(.2,.8,.25,1) infinite}
@keyframes rbturn{0%,55%{transform:rotate(0)}70%,100%{transform:rotate(360deg)}}
@keyframes rbneedle{0%,50%{transform:rotate(30deg)}78%{transform:rotate(1110deg)}88%{transform:rotate(1070deg)}100%{transform:rotate(1080deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.lhead{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.lhead h1{font-size:clamp(1.35rem,3.4vw,1.9rem)}
.stars{margin-left:auto;display:flex;align-items:center;gap:6px;font-weight:900;font-size:1.25rem;background:var(--yellow-soft);border-radius:999px;padding:4px 14px 4px 8px}
.stars svg{width:24px;height:24px}
.stars.bump{animation:pop .4s}
.prog{display:flex;align-items:center;gap:10px;margin-top:12px}
.dots{display:flex;align-items:center;flex:1;max-width:560px;min-width:0}
.dots button{width:22px;height:22px;flex:0 0 auto;border-radius:50%;border:3px solid var(--grey);background:var(--surface);padding:0}
.dots i{flex:1;height:4px;background:var(--grey);min-width:4px}
.dots button.done{background:var(--green);border-color:var(--green)}
.dots i.done{background:var(--green)}
.dots button.fixed{background:var(--orange);border-color:var(--orange)}
.dots button.now{border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-soft)}
.prog .cnt{font-weight:800;color:var(--muted);white-space:nowrap}
.lesson{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:18px;align-items:start}
@media (max-width:900px){.lesson{grid-template-columns:1fr}}
.taskgrid{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:18px;align-items:start}
@media (max-width:640px){.taskgrid{grid-template-columns:1fr}}
.tag{display:inline-block;font-size:.75rem;font-weight:800;padding:3px 10px;border-radius:999px;background:var(--primary-soft);color:var(--primary-text);margin-bottom:8px}
.qtext{font-size:clamp(1.1rem,2.6vw,1.3rem);font-weight:700}
.w{border:none;background:none;padding:0;font:inherit;border-bottom:2px dotted var(--primary-2);color:inherit}
.w:hover{background:var(--primary-soft);border-radius:4px}
.big{font-size:clamp(1.8rem,5vw,2.5rem);font-weight:900;margin-top:6px;font-variant-numeric:tabular-nums}
.visual{margin-top:14px;overflow-x:auto}
.ptable{border-collapse:separate;border-spacing:6px 4px;font-variant-numeric:tabular-nums}
.ptable th{font-size:.8rem;font-weight:900;color:#fff;border-radius:8px;padding:3px 8px}
.ptable td{font-size:1.5rem;font-weight:900;text-align:center;background:var(--surface2);border-radius:10px;width:46px;height:46px}
.ptable td.hl{background:var(--yellow-soft);box-shadow:inset 0 0 0 2.5px var(--yellow)}
.ptable td.op{background:none;color:var(--muted);width:24px}
.ptable tr.sum td{border-top:3px solid var(--text);border-radius:0;background:none;color:var(--muted)}
.ptable tr.sum td.op{border-top:none}
.c-dm{background:#9B6BFF}.c-um{background:#2E8CFF}.c-c{background:#22B565}.c-d{background:#E8A300}.c-u{background:#FF7A2F}
.nline{display:block;width:100%;max-width:460px;height:auto}
.hint-tap{font-size:.82rem;color:var(--muted);margin-top:12px}
.display{display:flex;align-items:center;justify-content:center;height:58px;border-radius:16px;background:var(--surface2);border:2.5px solid var(--line);font-size:1.8rem;font-weight:900;font-variant-numeric:tabular-nums;position:relative}
.display.bad{background:var(--red-soft);border-color:var(--red);color:var(--red);animation:shake .35s}
.display.ok{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.display .mk{position:absolute;right:14px;font-size:1.3rem}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.key{height:48px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-size:1.3rem;font-weight:800;box-shadow:0 3px 0 var(--line)}
.key:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.key:disabled,.check:disabled,.demo-err:disabled{opacity:.45;cursor:default}
.check{grid-column:1/-1;height:50px;border-radius:14px;border:none;background:var(--primary);color:#fff;font-weight:900;font-size:1.1rem;box-shadow:0 4px 0 #4B22C9}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:10px}
.choice{min-height:58px;border-radius:16px;border:2.5px solid var(--line);background:var(--surface);font-size:1.4rem;font-weight:900;box-shadow:0 3px 0 var(--line)}
.choice:hover{border-color:var(--primary-2)}
.choice.bad{background:var(--red-soft);border-color:var(--red);color:var(--red);animation:shake .35s}
.choice.ok{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.choice:disabled{cursor:default}
.demo-err{margin-top:10px;border:1.5px dashed var(--grey);background:none;border-radius:12px;padding:6px 10px;font-size:.82rem;font-weight:700;color:var(--muted);width:100%}
.chatcard{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:640px){.chatcard{grid-template-columns:1fr}.chatcard>.hero{display:none}}
.chat{display:grid;gap:9px;min-width:0}
.msg{display:flex;gap:8px;align-items:flex-end;animation:pop .28s ease-out}
.bub{background:var(--surface2);border-radius:18px 18px 18px 6px;padding:9px 14px;font-weight:700;max-width:48ch;border:1px solid var(--line)}
.msg .av{width:34px;height:34px;flex:0 0 auto;display:none}
@media (max-width:640px){.msg .av{display:block}}
.msg.me{justify-content:flex-end}
.msg.me .bub{background:var(--primary);color:#fff;border-color:var(--primary);border-radius:18px 18px 6px 18px}
.msg.good .bub{background:var(--green-soft)}
.answers{display:flex;flex-wrap:wrap;gap:8px}
.ans{min-width:64px;border-radius:14px;border:2.5px solid var(--line);background:var(--surface);padding:8px 16px;font-weight:900;font-size:1.1rem;box-shadow:0 3px 0 var(--line)}
.ans:hover{border-color:var(--primary)}
.rootbox{background:var(--green-soft);border-radius:18px;padding:14px 16px;display:grid;gap:4px;animation:pop .35s;border:1px solid var(--line)}
.rootbox .ttl{font-weight:900;font-size:.9rem;color:var(--green)}
.btn{border:none;border-radius:14px;padding:11px 20px;font-weight:900;font-size:1.02rem;background:var(--green);color:#fff;box-shadow:0 4px 0 #168A4B}
.btn.pri{background:var(--primary);box-shadow:0 4px 0 #4B22C9}
.btn.alt{background:var(--surface);color:var(--text);box-shadow:0 3px 0 var(--line);border:1.5px solid var(--line)}
.btn:active{transform:translateY(2px)}
.btn:disabled{opacity:.6}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.thread h3{font-size:1.1rem;background:var(--yellow-soft);display:inline-block;padding:4px 12px;border-radius:10px}
.track{list-style:none;margin:14px 0 0;padding:0;position:relative;display:grid;gap:12px}
.track::before{content:"";position:absolute;left:11px;top:12px;bottom:12px;border-left:3px solid var(--orange);opacity:.45}
.track li{position:relative;display:flex;gap:10px;align-items:flex-start;font-size:.9rem;color:var(--muted);font-weight:700}
.knot{width:25px;height:25px;flex:0 0 auto;border-radius:50%;border:3px solid var(--grey);background:var(--surface);display:grid;place-items:center;font-size:.75rem;color:#fff;position:relative;z-index:1}
.track li.done{color:var(--text)}
.track li.done .knot{border-color:var(--orange);background:var(--orange)}
.track li.bad{color:var(--text)}
.track li.bad .knot{border-color:var(--red);background:var(--red)}
.track li.found{color:var(--text)}
.track li.found .knot{border-color:var(--green);background:var(--green)}
.lang-note{background:var(--primary-soft);border:none}
.lang-note h3{font-size:1.05rem}
.sheet{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(430px,calc(100% - 32px));z-index:40;background:var(--surface);border-radius:24px;box-shadow:0 18px 50px rgba(40,20,120,.3);padding:18px;animation:pop .22s;border:1px solid var(--line)}
@media (max-width:760px){.sheet{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}
.sheet .es{font-weight:900;font-size:2rem}
.sheet .trw{font-size:1.3rem;font-weight:800;color:var(--primary-text)}
.x{position:absolute;right:12px;top:8px;border:none;background:none;font-size:1.6rem;color:var(--muted)}
.toast{position:fixed;left:50%;top:calc(76px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:50;background:var(--primary);color:#fff;border-radius:999px;padding:8px 18px;font-weight:800;box-shadow:0 8px 24px rgba(60,30,160,.3);animation:pop .22s;max-width:calc(100% - 32px);text-align:center}
.dhead{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.dhead h1{font-size:clamp(1.5rem,4vw,2.1rem)}
.meter{height:12px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:8px;max-width:360px;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:var(--green);transition:width .4s}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px}
.tile{perspective:700px;border:none;background:none;padding:0;position:relative}
.tile .in{position:relative;height:92px;transition:transform .45s;transform-style:preserve-3d}
.tile.flip .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;border:2.5px solid;display:grid;place-items:center;text-align:center;padding:8px;font-weight:900;font-size:1.3rem;color:#22204A;box-shadow:0 4px 0 rgba(0,0,0,.08)}
.face.back{transform:rotateY(180deg);font-size:1.05rem}
.face small{display:block;font-size:.72rem;font-weight:700;opacity:.7}
.badge{position:absolute;top:-10px;left:50%;transform:translateX(-50%);z-index:2;background:var(--orange);color:#fff;font-size:.72rem;font-weight:900;padding:2px 10px;border-radius:999px}
.slot{height:92px;border-radius:18px;border:2.5px dashed var(--grey);display:grid;place-items:center;color:var(--grey);font-weight:900;font-size:1.8rem}
.seg{display:inline-flex;background:var(--surface2);border-radius:14px;padding:4px;border:1px solid var(--line)}
.seg button{border:none;background:none;padding:7px 18px;border-radius:10px;font-weight:800;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--primary);color:#fff}
.kid{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.kid h1{font-size:clamp(1.4rem,3.4vw,1.9rem)}
.pgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.pgrid{grid-template-columns:1fr}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}}
.stats div{background:var(--surface2);border-radius:14px;padding:10px 12px}
.stats b{display:block;font-size:1.4rem;font-weight:900;font-variant-numeric:tabular-nums}
.stats small{color:var(--muted);font-weight:700}
.topic{border-bottom:1px solid var(--line)}
.topic:last-child{border-bottom:none}
.thead{width:100%;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(50px,1fr) auto 22px;gap:12px;align-items:center;padding:11px 2px;border:none;background:none;text-align:left}
.thead .nm{font-weight:800}
.bar{height:9px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap}
.st-dom{background:var(--green-soft);color:var(--green)} .st-cam{background:var(--yellow-soft);color:#9A6A00} .st-atk{background:var(--red-soft);color:var(--red)} .st-new{background:var(--surface2);color:var(--muted)}
:root[data-theme="dark"] .st-cam{color:var(--yellow)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .st-cam{color:var(--yellow)}}
.chev{transition:transform .2s;color:var(--muted)}
.topic.open .chev{transform:rotate(180deg)}
.subs{display:grid;gap:8px;padding:0 0 12px 14px}
.sub{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(50px,1fr) auto;gap:10px;align-items:center;font-size:.92rem;font-weight:700}
@media (max-width:520px){.thead{grid-template-columns:minmax(0,1fr) 56px auto 18px}.thead .chip span{display:none}.sub{grid-template-columns:minmax(0,1fr) 56px auto}}
.stuck{background:var(--red-soft);border-radius:18px;padding:14px 16px;display:grid;gap:8px;border:1px solid var(--line)}
.stuck p{margin:0}
.hist{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:8px}
.hist li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;font-weight:700;font-size:.93rem}
.hist .ex{font-variant-numeric:tabular-nums}
.hist .ic{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;color:#fff;font-weight:900;font-size:.8rem}
.sum3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:10px}
.sum3>div{border-radius:16px;padding:12px 14px}
.sum3 h3{font-size:1rem;margin-bottom:4px}
.sum3 ul{margin:6px 0 0;padding-left:18px;font-size:.92rem;font-weight:700;display:grid;gap:4px}
.class-grid{overflow-x:auto}
.class-grid table{border-collapse:separate;border-spacing:0 8px;width:100%;min-width:480px}
.class-grid td,.class-grid th{text-align:left;padding:2px 8px;font-size:.92rem}
.class-grid th{font-size:.78rem;color:var(--muted)}
.stack{display:flex;height:16px;border-radius:99px;overflow:hidden;min-width:180px}
.names{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.names span{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-weight:700;font-size:.88rem}
.fine{font-size:.85rem;color:var(--muted)}
.aibar{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;display:grid;gap:8px}
.aitoggle{display:flex;align-items:center;gap:8px;font-weight:900;cursor:pointer}
.aitoggle input{width:18px;height:18px;accent-color:var(--primary)}
.aidot{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
.askrow{display:flex;gap:8px}
.askrow input{flex:1;min-width:0;border:2px solid var(--line);border-radius:14px;padding:10px 14px;font:inherit;font-weight:700;background:var(--surface);color:var(--text)}
.askrow input:focus{outline:none;border-color:var(--primary)}
.askrow .btn{padding:8px 16px}
.typing .bub{color:var(--muted);font-style:italic}
.typing .bub::after{content:"";display:inline-block;width:1.2em;text-align:left;animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.welcome{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center;background:linear-gradient(135deg,var(--surface) 0%,var(--primary-soft) 100%)}
@media (max-width:640px){.welcome{grid-template-columns:1fr;justify-items:center;text-align:center}}
.welcome .bighero{width:clamp(140px,26vw,220px);height:clamp(140px,26vw,220px)}
.welcome h1{font-size:clamp(1.8rem,5vw,2.8rem)}
.wsay{display:grid;gap:8px;margin-top:14px}
.wsay .bub{max-width:none;background:var(--surface)}
@media (max-width:640px){.wsay{justify-items:center}}
.wfacts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:520px){.wfacts{grid-template-columns:1fr}}
.wfacts div{display:flex;gap:12px;align-items:center}
.wfacts .ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:1.4rem;flex:0 0 auto}
.wfacts b{display:block;font-size:1.3rem;font-weight:900}
.wfacts small{color:var(--muted);font-weight:700}
.plan{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
.plan li{display:flex;gap:10px;align-items:center;font-weight:700}
.plan .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;font-size:.85rem;flex:0 0 auto}
.btn.big{font-size:1.25rem;padding:14px 30px}
.timer{display:flex;align-items:center;gap:6px;font-weight:900;font-size:1.15rem;background:var(--blue-soft);border-radius:999px;padding:5px 14px;font-variant-numeric:tabular-nums}
.timer.low{background:var(--red-soft);color:var(--red)}
.lhead .stars{margin-left:0}
.lhead .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.sumgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.sumgrid div{background:var(--surface2);border-radius:14px;padding:10px 12px;text-align:center}
.sumgrid b{display:block;font-size:1.5rem;font-weight:900}
.demo-note{font-size:.8rem;color:var(--muted);text-align:center;margin-top:24px}
</style>
